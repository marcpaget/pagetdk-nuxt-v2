name: CI/CD (Nixpacks)

on:
  push:
    branches: [cicd-pipeline]
  pull_request:
    branches: [cicd-pipeline]

jobs:
  # ─────────────────────────────────────────────
  # 1. Unit tests (Vitest + @nuxt/test-utils)
  # ─────────────────────────────────────────────
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit tests
        run: npm run test:unit

  # ─────────────────────────────────────────────
  # 2. E2E tests (Playwright + @nuxt/test-utils)
  # ─────────────────────────────────────────────
  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────
  # 3. Deploy to Dokploy via webhook
  #    Dokploy pulls from GitHub and builds with Nixpacks
  #    Only runs on push to cicd-pipeline after tests pass
  # ─────────────────────────────────────────────
  deploy-dokploy:
    name: Deploy → Dokploy
    runs-on: ubuntu-latest
    needs: [unit-test, e2e-test]
    if: github.ref == 'refs/heads/cicd-pipeline' && github.event_name == 'push'
    environment: production

    steps:
      - name: Trigger Dokploy redeploy webhook
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -L \
            "${{ secrets.DOKPLOY_WEBHOOK_URL_NUXT_NIXPACKS }}" \
            -H "Content-Type: application/json" \
            -d '{}')

          echo "Dokploy webhook responded with HTTP $HTTP_STATUS"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 400 ]; then
            echo "Dokploy deployment trigger failed (HTTP $HTTP_STATUS)"
            exit 1
          fi
