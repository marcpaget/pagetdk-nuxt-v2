name: Nixpacks Nuxt CI

on:
  push:
    branches:
      - main
      - master
      - work
      - cicd-pipeline
  pull_request:

jobs:
  build:
    name: Build Nuxt app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build
        run: npm run build
