name: CI/CD

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
      NUXT_PUBLIC_SUPABASE_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_KEY }}
      UMAMI_ID: ${{ secrets.UMAMI_ID }}
      UMAMI_HOST: ${{ secrets.UMAMI_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
      NUXT_PUBLIC_SUPABASE_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_KEY }}
      UMAMI_ID: ${{ secrets.UMAMI_ID }}
      UMAMI_HOST: ${{ secrets.UMAMI_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  ci:
    name: CI
    if: always()
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: test "$CHECKS_RESULT" = success && test "$E2E_RESULT" = success

  build-and-push:
    name: Build & Push Docker Image
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
      NUXT_PUBLIC_SUPABASE_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_KEY }}
      UMAMI_ID: ${{ secrets.UMAMI_ID }}
      UMAMI_HOST: ${{ secrets.UMAMI_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.ref_name == 'dev' && 'staging' || 'production' }}
            type=sha,format=long,prefix=${{ github.ref_name == 'dev' && 'staging' || 'production' }}-sha-
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          # Secret changes must also rebuild the compiled client configuration.
          no-cache-filters: build
          secret-envs: |
            NUXT_PUBLIC_SUPABASE_URL=NUXT_PUBLIC_SUPABASE_URL
            NUXT_PUBLIC_SUPABASE_KEY=NUXT_PUBLIC_SUPABASE_KEY
            UMAMI_ID=UMAMI_ID
            UMAMI_HOST=UMAMI_HOST
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}

  deploy:
    name: Deploy ${{ github.ref_name == 'dev' && 'staging' || 'production' }}
    needs: build-and-push
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ github.ref_name == 'dev' && 'staging' || 'production' }}
    steps:
      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_API_URL: ${{ secrets.DOKPLOY_ENV_API_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_ENV_API_TOKEN }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_ENV_APPLICATION_ID }}
        run: |
          : "${DOKPLOY_API_URL:?Set DOKPLOY_ENV_API_URL in this GitHub environment}"
          : "${DOKPLOY_API_TOKEN:?Set DOKPLOY_ENV_API_TOKEN in this GitHub environment}"
          : "${DOKPLOY_APPLICATION_ID:?Set DOKPLOY_ENV_APPLICATION_ID in this GitHub environment}"
          payload=$(jq -n --arg id "$DOKPLOY_APPLICATION_ID" '{applicationId: $id}')
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 60 \
            --request POST "$DOKPLOY_API_URL" \
            --header 'Content-Type: application/json' \
            --header "x-api-key: $DOKPLOY_API_TOKEN" \
            --data "$payload")
          if [[ "$status" != 2?? ]]; then
            echo "::error::Dokploy deployment request failed (HTTP $status)"
            exit 1
          fi
          echo "Dokploy accepted the deployment request (HTTP $status)."
